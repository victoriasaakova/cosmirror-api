takeaways:
- Карта не отвечает вместо тебя, но помогает точнее увидеть, какой вопрос стоит отделить от общего напряжения. Дальше полезнее
  проверять эту гипотезу на собственном опыте.
- Возможно, сейчас важен не только сам выбор, но и критерий, по которому он будет ощущаться твоим. Разбор помогает увидеть
  этот критерий яснее, а следующий слой — проверить его в реальной жизни.
- Главное здесь — не превратить карту в инструкцию. Её ценность в том, чтобы показать возможную закономерность и дать более
  точную точку для самостоятельной проверки.
