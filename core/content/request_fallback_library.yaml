meta:
  name: Cosmirror Request Fallback Library
  version: '1.0'
  rule: Only whole pre-authored sentences/blocks; no grammar-slot insertion.
focus_sentences:
  relationships: 'В центре внимания — отношения и близость: важно понять не только, что происходит между людьми, но и что
    в контакте действительно подходит тебе.'
  self_realization: 'В центре внимания — самореализация и собственный путь: вопрос касается не только результата, но и того,
    какой способ реализовываться ощущается своим.'
  work: 'В центре внимания — работа и профессиональное направление: важно отделить привычную роль от того, что по-прежнему
    имеет для тебя смысл.'
  money: 'В центре внимания — деньги и устойчивость: здесь особенно важно различать реальную опору, масштаб и цену решений,
    которые принимаются только ради чувства безопасности.'
  self_understanding: 'В центре внимания — понимание себя: хочется не получить ещё один ярлык, а увидеть, какие внутренние
    закономерности действительно повторяются.'
  decision: 'В центре внимания — выбор: важно понять не только варианты, но и критерий, по которому решение будет ощущаться
    твоим.'
  change: 'В центре внимания — изменения: вопрос не только в том, что поменять, но и в том, что стоит сохранить в новой форме.'
  energy: 'В центре внимания — нагрузка и восстановление: важно понять, что действительно расходует ресурс и какой способ
    справляться уже перестал помогать.'
  family_home: 'В центре внимания — дом, семья и чувство опоры: здесь особенно важны границы между близостью, привычкой и
    собственным ощущением безопасности.'
  self_expression: 'В центре внимания — самовыражение: вопрос касается того, насколько собственная позиция выдерживает чужую
    реакцию и неопределённость результата.'
  multi: Сейчас несколько сфер звучат одновременно. Полезно не искать одну «главную проблему», а увидеть, какая внутренняя
    тема повторяется в разных контекстах.
  default: В центре внимания — вопрос, который затрагивает не одну ситуацию, а способ выбирать, реагировать или удерживать
    опору.
life_stage_sentences:
  transition: 'Сейчас жизнь больше похожа на переход, чем на устойчивый этап: прежняя конструкция уже не полностью подходит,
    а новая ещё не стала очевидной.'
  stuck: Сейчас особенно заметно ощущение, что привычный способ двигаться дальше не даёт прежней ясности.
  new_beginning: Сейчас начинается новый этап, и вместе с интересом к нему может быть больше вопросов о том, на что действительно
    стоит опираться.
  uncertainty: 'Сейчас на переднем плане неопределённость: важный вопрос уже требует внимания, но одного очевидного ответа
    пока нет.'
  growth: Сейчас больше внимания уходит на рост и следующий уровень — не только на то, что возможно, но и на то, что действительно
    подходит.
  stable_search: Внешне многое может оставаться достаточно стабильным, но внутри уже появился вопрос, который прежняя схема
    не закрывает.
  default: 'Сейчас есть тема, к которой ты возвращаешься не только из любопытства: она уже влияет на то, как ты смотришь на
    следующий шаг.'
outcomes:
  understand_self:
    title: Понять себя без нового ярлыка
    text: Запрос ближе к тому, чтобы увидеть собственные закономерности и потенциал без попытки свести себя к одному описанию.
      Карта здесь полезна не как окончательный ответ, а как способ проверить, какие темы действительно повторяются в твоём
      опыте.
  make_decision:
    title: Разобраться, по какому критерию выбирать
    text: Здесь цель не просто получить ответ «да или нет». Важнее понять, какие две потребности или ценности сейчас конкурируют
      и какой критерий решения будет твоим, а не только способом быстрее снять напряжение.
  find_direction:
    title: Найти направление, которое ощущается своим
    text: 'Запрос касается не только следующего шага, но и направления: что хочется продолжать, что уже стало тесным и что
      должно сохраниться даже при изменении формы.'
  understand_period:
    title: Понять, что именно стало заметнее сейчас
    text: Здесь важно отделить устойчивые темы карты от временной активации. Цель — понять, какая тема периода сейчас громче
      обычного и где она действительно совпадает с твоим жизненным опытом.
  relationships:
    title: Понять свою часть динамики в отношениях
    text: Запрос лучше рассматривать не как попытку объяснить другого человека, а как способ увидеть собственные потребности,
      реакции и критерии близости.
  clarity:
    title: Отделить ясность от требования гарантии
    text: Запрос ближе к поиску ясности. Важно проверить, где действительно не хватает информации, а где хочется получить
      чувство полной определённости до действия.
  change:
    title: Понять, что именно хочется изменить
    text: Здесь полезно различить реальное несоответствие и желание быстрее выйти из напряжения. Оба импульса могут звучать
      похоже, но приводят к разным решениям.
  default:
    title: Понять, что именно стоит различить
    text: Запрос не требует от карты готового решения. Полезнее использовать её как рамку, которая помогает увидеть повторяющееся
      напряжение и проверить его на собственном опыте.
canonical_themes:
  identity_and_autonomy:
    aliases:
    - identity_and_autonomy
    - self_direction
    - self_expression
    - action_and_identity
    - growth_and_identity
    - power_and_identity
    - identity_and_visibility
    title: Прежняя роль ↔ живое ощущение себя
    connection: 'Эта тема важна для запроса, потому что он затрагивает не только внешний вариант, но и ощущение авторства:
      насколько выбранная роль, формат или направление по-прежнему воспринимаются как свои. Полезно проверять не «кем нужно
      стать», а где старая версия себя уже перестала описывать текущий опыт.'
    distinction: Возможно, главный вопрос здесь — не просто менять или сохранять прежнюю форму, а понять, что именно в ней
      всё ещё твоё. Желание обновления может быть точным сигналом, но скорость перемен сама по себе не доказывает, что направление
      выбрано верно.
    resource: Опора здесь — способность замечать несоответствие между ролью и внутренним ощущением авторства. Её полезно использовать
      не для резкого обнуления, а для более точной настройки формы.
  safety_and_change:
    aliases:
    - safety_vs_change
    - stability_vs_change
    - safety_vs_freedom
    - pace_and_stability
    - intensity_vs_stability
    - emotional_safety
    - home_and_support
    title: Опора ↔ изменение
    connection: 'Эта тема важна, если одновременно хочется перемен и устойчивости. Карта здесь не предлагает выбирать между
      движением и безопасностью: полезнее увидеть, какая опора действительно поддерживает переход, а какая удерживается только
      потому, что знакома.'
    distinction: Стоит проверить разницу между «мне нужна опора» и «мне нужно, чтобы ничего не менялось». Это разные задачи.
      Изменение может быть точным даже при дискомфорте, а знакомое — привычным без того, чтобы оставаться полезным.
    resource: Ресурс — способность сохранять несколько стабильных точек, пока меняется остальная конструкция.
  control_and_uncertainty:
    aliases:
    - control_vs_uncertainty
    - control_and_structure
    - scale_and_control
    - emotion_and_control
    - frustration_and_control
    - power_and_action
    title: Ясность ↔ гарантия
    connection: 'Эта тема важна там, где вопрос хочется решить окончательно. Дополнительный контроль, анализ или проверка
      могут реально помогать — но только до момента, когда задача меняется: уже не понять ситуацию, а добиться гарантии, которой
      у решения всё равно не будет.'
    distinction: Здесь полезнее всего различать ясность и гарантию. Ясность может расти через данные и опыт. Гарантия требует
      заранее знать исход — и поэтому способна удерживать вопрос открытым бесконечно.
    resource: Опора — способность проверять реальность и замечать слабые места. Этот ресурс работает лучше, когда у каждой
      дополнительной проверки есть конкретный вопрос.
  closeness_and_autonomy:
    aliases:
    - autonomy_vs_closeness
    - closeness_and_identity
    - emotional_autonomy
    - desire_and_relationships
    - reciprocity_and_self_position
    title: Близость ↔ право оставаться отдельным человеком
    connection: 'Эта тема важна для запроса об отношениях, потому что близость и автономия могут становиться похожими на взаимоисключающие
      требования. Полезно исследовать не только желание приблизиться или отдалиться, но и форму контакта: есть ли в ней место
      для собственной позиции.'
    distinction: Стоит различать потребность в пространстве и отсутствие желания быть в контакте. Иногда дистанция показывает
      несовместимость, а иногда оказывается знакомым способом вернуть себе границы.
    resource: Опора — способность замечать, где контакт остаётся взаимным, а где приходится слишком сильно подстраиваться.
  quality_and_action:
    aliases:
    - quality_and_action
    - self_expression_vs_self_criticism
    - speed_vs_accuracy
    - thought_and_action
    - clarity_and_motivation
    title: Качество ↔ право действовать до полной уверенности
    connection: Эта тема важна, если запрос упирается в готовность действовать. Высокая внутренняя планка может действительно
      улучшать результат, но она же способна превращать чувство уверенности в разрешение на действие.
    distinction: Полезно различать «результат ещё требует работы» и «мне всё ещё страшно показать его реальности». Дополнительная
      подготовка помогает только в первом случае.
    resource: Опора — способность видеть детали и повышать качество. Её можно использовать точнее, если заранее определить
      критерий «достаточно для следующей проверки».
  growth_and_limits:
    aliases:
    - expansion_and_limits
    - expansion_vs_limits
    - growth_and_structure
    - growth_and_work
    - growth_and_visibility
    - values_and_growth
    title: Возможность ↔ реальный ресурс
    connection: Эта тема важна, если запрос связан с ростом, деньгами или новым направлением. Возможность может быть действительно
      привлекательной, но сама по себе ещё не отвечает на вопросы о времени, ресурсе и устойчивой форме.
    distinction: Стоит различать «я вижу больше возможностей» и «я уже могу удерживать больший масштаб». Ограничение иногда
      показывает не запрет, а конструкцию, которая нужна росту.
    resource: Опора — способность одновременно видеть перспективу и проверять, какую форму она выдержит.
  idealism_and_reality:
    aliases:
    - idealism_vs_realism
    - image_vs_reality
    - idealism_and_relationships
    - idealism_and_work
    - interpretation_vs_fact
    - sensitivity_and_image
    title: Ощущение ↔ проверяемая реальность
    connection: Эта тема важна, когда сильное ощущение, надежда или образ начинают влиять на решение. Они могут содержать
      важную информацию, но не автоматически доказывают вывод о человеке, ситуации или будущем.
    distinction: 'Полезно отделить три слоя: что известно, что предполагается и на что хочется надеяться. Это не обесценивает
      интуицию — оно делает вывод точнее.'
    resource: Опора — способность видеть больше одного слоя ситуации, если образ остаётся открытым для проверки реальностью.
  sensitivity_and_boundaries:
    aliases:
    - sensitivity_vs_boundaries
    - sensitivity_and_boundaries
    - boundaries
    - trust_and_boundaries
    - emotional_interface
    title: Чувствительность ↔ граница между собой и ситуацией
    connection: Эта тема важна, если запрос связан с сильной реакцией на атмосферу, отношения или чужую оценку. Чувствительность
      помогает замечать изменения, но ощущение ещё не говорит, что интерпретация этих изменений точна.
    distinction: Стоит различать «я действительно это чувствую» и «я точно знаю, почему это происходит». Первый слой — факт
      собственного опыта; второй требует данных.
    resource: Опора — способность замечать тонкие изменения раньше, чем они становятся очевидными, сохраняя границу между
      переживанием и выводом.
  visibility_and_self_direction:
    aliases:
    - visibility_vs_protection
    - recognition_vs_autonomy
    - identity_and_visibility
    - growth_and_visibility
    - self_expression
    - voice_and_identity
    title: Видимость ↔ собственный критерий
    connection: Эта тема важна, если запрос касается проявленности, работы или самооценки. Чем значимее результат, тем легче
      чужой отклик превращается из информации в доказательство собственной ценности.
    distinction: 'Полезно разделить две задачи: сделать работу понятной другим и получить от других разрешение считать её
      достаточно хорошей. Первая решается обратной связью; у второй может не быть окончательного внешнего ответа.'
    resource: Опора — способность учитывать реакцию среды, не отдавая ей право полностью определять направление.
  achievement_and_rest:
    aliases:
    - achievement_vs_rest
    - achievement_and_structure
    - work_and_emotional_needs
    - action_and_work
    title: Движение ↔ восстановление
    connection: Эта тема важна, если запрос связан с нагрузкой, работой или ощущением, что останавливаться опасно. Усилие
      поддерживает чувство влияния, но постоянное движение не всегда означает, что курс остаётся точным.
    distinction: Стоит различать отдых и отказ от цели. Пауза может быть частью устойчивого движения, а не признаком потери
      мотивации.
    resource: Опора — способность выдерживать длительное усилие, если рядом остаётся право корректировать нагрузку.
  harmony_and_honesty:
    aliases:
    - harmony_vs_honesty
    - comfort_and_closeness
    - communication_and_values
    title: Сохранить контакт ↔ сохранить собственную позицию
    connection: Эта тема важна, если в запросе есть отношения, компромисс или страх лишнего конфликта. Согласие может помогать
      беречь связь, но если оно возникает раньше, чем собственная позиция успевает стать ясной, цена контакта постепенно растёт.
    distinction: Полезно различать компромисс и автоматическую уступку. Компромисс предполагает, что твоя позиция сначала
      существует и только потом участвует в договорённости.
    resource: Опора — способность замечать другую сторону и искать форму взаимности, не используя это вместо собственной позиции.
  meaning_and_direction:
    aliases:
    - meaning_and_direction
    - learning_and_meaning
    - growth_and_identity
    - identity_and_work
    title: Смысл ↔ окончательный план
    connection: Эта тема важна для запроса о пути и реализации. Понимание того, что имеет смысл, не всегда сразу даёт готовую
      форму профессии, проекта или следующего шага.
    distinction: Стоит различать направление и окончательный план. Направление может быть достаточно ясным, чтобы сделать
      следующий эксперимент, даже если вся траектория ещё не видна.
    resource: Опора — способность замечать, что возвращает ощущение смысла и интереса, и использовать это как критерий для
      проверки.
  analysis_and_spontaneity:
    aliases:
    - analysis_vs_spontaneity
    - big_picture_vs_detail
    - emotion_and_thought
    - imagination_and_thought
    - depth_and_thought
    title: Понять ↔ позволить реальности ответить
    connection: Эта тема важна, если вопрос долго остаётся внутри анализа. Часть информации появляется только после контакта
      с реальностью — разговора, теста, действия или наблюдения.
    distinction: Полезно различать вопрос, на который можно ответить размышлением, и вопрос, для которого уже нужны новые
      данные.
    resource: Опора — способность видеть варианты и связи, если у анализа есть точка остановки и способ получить новые данные.
  depth_and_simplicity:
    aliases:
    - depth_vs_simplicity
    - depth_and_thought
    - deep_change
    - emotional_intensity
    - power
    title: Глубина ↔ право не усложнять всё
    connection: Эта тема важна, если вопрос хочется понять до самого основания. Глубина помогает увидеть механизм, но не каждая
      ситуация требует полного объяснения прежде, чем можно сделать следующий шаг.
    distinction: Стоит различать «здесь есть ещё важный слой» и «я не могу остановиться, пока не пойму всё». Первое углубляет
      понимание; второе может поддерживать напряжение.
    resource: Опора — способность не довольствоваться поверхностным ответом и при этом дозировать глубину по задаче.
  action_and_pressure:
    aliases:
    - reactivity_vs_choice
    - conflict_and_agency
    - frustration_and_control
    - power_and_action
    - emotion_and_action
    title: Действие ↔ срочность
    connection: Эта тема важна, если напряжение быстро превращается в импульс что-то сделать. Действие может быть точным способом
      вернуть влияние, но срочность не всегда говорит, что именно это действие необходимо.
    distinction: Полезно различать «нужен шаг» и «мне нужно, чтобы напряжение закончилось прямо сейчас». Иногда одно действие
      решает обе задачи, но это стоит проверить.
    resource: Опора — способность не оставаться пассивным перед неопределённостью и использовать маленькие обратимые шаги.
  structure_and_freedom:
    aliases:
    - structure_and_freedom
    - freedom_vs_structure
    - novelty_vs_structure
    - structure
    - action_and_structure
    title: Структура ↔ свобода
    connection: Эта тема важна, если правила, обязательства или форма одновременно поддерживают и ограничивают. Вопрос не
      обязательно в том, нужна ли структура, а в том, какая структура создаёт опору и какая уже существует только по инерции.
    distinction: Стоит различать ограничение и форму. Форма может помогать свободе реализоваться в реальности; ограничением
      она становится там, где больше не обслуживает задачу.
    resource: Опора — способность создавать рабочую конструкцию вокруг важного, сохраняя право пересматривать правила.
focus_relevance:
