  version: '1.0'
  runtime_llm_required: false
  coverage:
    planet_planet_units: 225
    planet_angle_units: 100
    total_semantic_units: 325
    theme_syntheses: 12
    aspect_types:
    - conjunction
    - square
    - opposition
    - trine
    - sextile
  rules:
  - Use complete semantic units only
  - Never assemble user-facing prose from planet-function nouns at runtime
  - Never field-merge fallback and LLM content
  - Use ASC/MC aspects only when birth time and angles are valid
  - Outer-planet-only aspects are low priority unless reinforced by personal or angular factors
  - Astrology is a symbolic interpretive framework; lived experience remains the user authority
