    headline: Когда «кто я» и «что мне нужно» трудно разделить
    summary: 'Идентичность и эмоциональная реакция тесно сцеплены: то, что затрагивает чувство «это я», быстро становится
      эмоционально значимым, а настроение сильнее окрашивает самоощущение.'
    deep_read:
    - 'В соединении две функции работают почти как один узел: трудно включить одну, не задев другую. Идентичность и эмоциональная
      реакция тесно сцеплены: то, что затрагивает чувство «это я», быстро становится эмоционально значимым, а настроение сильнее
      окрашивает самоощущение. Возможные проявления: важное решение может одновременно вызывать ясность и внутреннее сопротивление;
      бывает трудно отделить временное состояние от вывода «это не моё».'
    - 'Один из возможных способов регулировать эту динамику — сохранить целостность и не действовать так, будто собственные
      чувства не имеют значения. В этом есть логика: стратегия помогает сохранить важную функцию. Цена появляется там, где
      она превращается в обязательное условие. Если внутреннее согласие становится обязательным условием действия, дискомфорт
      может начать звучать как запрет.'
    possible_manifestations: &id001
    - важное решение может одновременно вызывать ясность и внутреннее сопротивление
    - бывает трудно отделить временное состояние от вывода «это не моё»
    protective_hypothesis: Сохранить целостность и не действовать так, будто собственные чувства не имеют значения.
    resource: Способность связывать направление с реальными потребностями и замечать расхождение между решением и внутренним
      состоянием.
