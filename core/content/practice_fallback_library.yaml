meta:
  name: Cosmirror Practice Fallback Library
  version: '1.0'
  rule: Select one whole module; never field-merge modules.
request_theme_to_module:
  identity_and_autonomy: identity_and_autonomy
  safety_and_change: safety_and_change
  control_and_uncertainty: control_and_uncertainty
  closeness_and_autonomy: closeness_and_autonomy
  quality_and_action: quality_and_action
  growth_and_limits: growth_and_limits
  idealism_and_reality: idealism_and_reality
  sensitivity_and_boundaries: sensitivity_and_boundaries
  visibility_and_self_direction: visibility_and_self_direction
  achievement_and_rest: achievement_and_rest
  harmony_and_honesty: harmony_and_honesty
  meaning_and_direction: meaning_and_direction
  analysis_and_spontaneity: analysis_and_spontaneity
  depth_and_simplicity: depth_and_simplicity
  action_and_pressure: action_and_pressure
  structure_and_freedom: structure_and_freedom
modules:
  identity_and_autonomy:
    headline: Прежняя роль и живое ощущение себя могут расходиться
    start_here: 'Иногда вопрос о переменах начинается раньше внешнего решения: привычная роль всё ещё существует, но хуже
      описывает, как хочется проявляться сейчас. Полезнее не обнулять прошлое, а проверить, какая часть формы всё ещё твоя,
      а какая держится на инерции.'
    pattern: Может повторяться маятник между адаптацией к знакомой роли и желанием резко выйти из неё. Оба движения могут
      обходить промежуточный вариант — изменить форму без отрицания всего прошлого опыта.
    protective_function: Сохранение роли поддерживает устойчивость и понятность. Резкий отказ возвращает ощущение авторства.
      Вопрос — какую из этих задач решает конкретная реакция.
    cost: Если выбор сводится к «остаться прежним» или «полностью стать другим», теряется возможность перенести сильные части
      опыта в новую форму.
    distinctions:
    - left: роль
      right: идентичность
      note: Роль — форма участия, а не полное определение себя.
    - left: обновление
      right: обнуление
      note: Изменить способ проявляться можно без отказа от всего прошлого.
    values: Что в прежней версии жизни хочется сохранить потому, что это действительно важно, а не только потому, что знакомо?
    questions:
    - 'Что именно стало тесным: сфера, способ участия, ожидания или образ себя?'
    - Какая часть прежней роли всё ещё ощущается своей?
    - Что хочется сохранить при большой перемене?
    - Какой новый способ проявляться можно проверить без окончательного отказа?
    experiment: На несколько дней измени только одну часть привычной роли — формат, правило, степень видимости или тип задачи.
      Смотри, меняется ли ощущение «это моё» без полного обнуления.
    observe:
    - где роль ощущается живой, а где автоматической
    - что возвращает чувство авторства
    - какие изменения требуют новой формы, а не полного отказа
  safety_and_change:
    headline: Опора не требует, чтобы всё оставалось прежним
    start_here: Перемены особенно сложны, когда вместе с ними исчезают привычные ориентиры. Желание сохранить знакомое не
      обязательно означает, что изменение не подходит. Полезно разделить потребность в опоре и конкретный способ, которым
      она обеспечивается.
    pattern: В переходе может хотеться либо удерживать старую конструкцию дольше, чем она поддерживает, либо резко изменить
      всё, чтобы быстрее закончить промежуточное состояние.
    protective_function: 'Обе реакции могут возвращать предсказуемость: сохранение уменьшает неизвестное, а резкое решение
      быстро закрывает вопрос.'
    cost: Если критерием становится скорость возвращения устойчивости, можно либо слишком долго оставаться в знакомом, либо
      менять слишком много сразу.
    distinctions:
    - left: опора
      right: неподвижность
      note: Опора может сохраняться внутри изменений.
    - left: изменение
      right: обнуление
      note: Точное изменение не требует разрушать всю конструкцию.
    values: Что из прежней жизни важно сохранить как ценность, даже если форма изменится?
    questions:
    - Что из привычного реально поддерживает, а что только знакомо?
    - Что хочется сохранить, когда перемена откладывается?
    - Что хочется перестать чувствовать, когда возникает импульс изменить всё?
    - Какая одна опора может остаться стабильной?
    experiment: Измени одну небольшую часть ситуации на несколько дней, сохранив одну привычную опору намеренно. Проверь,
      становится ли яснее, что действительно тесно.
    observe:
    - где знакомое автоматически считается безопасным
    - где срочность перемен растёт вместе с напряжением
    - какие опоры можно перенести в новую форму
  control_and_uncertainty:
    headline: Ясность и гарантия — не одно и то же
    start_here: Когда вопрос важен, естественно хотеть больше определённости. Проблема начинается, когда задача проверки меняется
      с «что ещё узнать?» на «как сделать так, чтобы ошибиться было невозможно?».
    pattern: Можно собирать ещё информацию, перепроверять решение или откладывать действие до полной ясности. Критерий незаметно
      смещается от качества решения к попытке заранее гарантировать исход.
    protective_function: Контроль может возвращать ощущение влияния там, где часть результата зависит не от тебя.
    cost: Если новые данные уже не меняют решение, но без очередной проверки трудно остановиться, энергия уходит на получение
      чувства безопасности заранее.
    distinctions:
    - left: ясность
      right: гарантия
      note: Ясность растёт через данные; гарантия требует заранее знать исход.
    - left: проверка
      right: успокоение
      note: Не каждая проверка приносит новую информацию.
    values: Если полной гарантии не будет, какой способ действия всё равно лучше соответствует тому, что для тебя важно?
    questions:
    - Какой вопрос решает следующая проверка?
    - Что нового даст ещё один круг анализа?
    - Когда данных уже достаточно, но спокойствия всё ещё нет?
    - Какой маленький шаг даст новую информацию?
    experiment: 'Перед следующей проверкой запиши: «какой новый факт я получу?». Если ответа нет, сделай один обратимый шаг,
      который даст обратную связь из реальности.'
    observe:
    - момент, когда анализ перестаёт давать новые данные
    - желание решить вопрос только ради облегчения
    - действия, которые дают больше ясности
  closeness_and_autonomy:
    headline: Близость и пространство не обязательно исключают друг друга
    start_here: Желание отдалиться может быть важным сигналом, но оно не всегда отвечает на вопрос о самой связи. Иногда дистанция
      означает «мне это не подходит», а иногда — «в этой форме мне не хватает пространства».
    pattern: Когда контакт становится интенсивнее или появляются ожидания, может хотеться вернуть автономию через дистанцию,
      молчание или снижение вовлечённости.
    protective_function: Дистанция быстро возвращает ощущение собственных границ и снижает влияние чужих ожиданий.
    cost: Если потребность в пространстве становится доказательством несовместимости до попытки обозначить границу, уменьшается
      шанс найти более подходящую форму контакта.
    distinctions:
    - left: пространство
      right: дистанция
      note: Пространство иногда можно создать внутри контакта.
    - left: граница
      right: отказ от близости
      note: Граница описывает форму участия, а не обязательно его отсутствие.
    values: Как должен выглядеть контакт, чтобы в нём одновременно оставались близость и право быть отдельным человеком?
    questions:
    - Когда желание отдалиться становится особенно сильным?
    - Чего именно в контакте становится слишком много?
    - Что дистанция возвращает быстрее всего?
    - Какая договорённость могла бы дать больше пространства?
    experiment: В одной безопасной ситуации сначала обозначь одну конкретную границу или просьбу до увеличения дистанции.
      Не использовать в опасных или насильственных отношениях.
    observe:
    - что запускает желание дистанцироваться
    - где граница работает лучше, чем исчезновение
    - какие формы близости дают пространство
  quality_and_action:
    headline: Качество не требует полной уверенности
    start_here: Высокая планка помогает видеть слабые места. Но чувство «ещё недостаточно» не всегда содержит новую информацию
      о качестве. Важно увидеть момент, когда доработка улучшает результат, а когда откладывает внешнюю проверку.
    pattern: Можно долго редактировать, уточнять и ждать правильного внутреннего состояния перед показом результата. Чем важнее
      работа, тем убедительнее звучит мысль, что ещё одна итерация необходима.
    protective_function: Подготовка снижает риск ошибки и поддерживает ощущение компетентности.
    cost: Если цель — исключить возможность критики, критерий готовности становится недостижимым, а реальная обратная связь
      приходит слишком поздно.
    distinctions:
    - left: качество
      right: уверенность
      note: Результат может быть достаточно качественным до появления уверенности.
    - left: доработка
      right: откладывание оценки
      note: Одинаковое действие может выполнять разные функции.
    values: Что в результате важно сохранить, если убрать задачу выглядеть безошибочно?
    questions:
    - Какой критерий качества нужен перед следующим шагом?
    - Что конкретно улучшит ещё одна итерация?
    - Что можно узнать только после внешней проверки?
    - Какой минимальный выпуск даст честную обратную связь?
    experiment: Зафиксируй три критерия «достаточно для проверки». Когда они выполнены, покажи результат в маленьком безопасном
      контексте вместо ещё одной внутренней доработки.
    observe:
    - когда критерий готовности начинает двигаться
    - какие доработки реально меняют результат
    - что даёт внешняя проверка
  growth_and_limits:
    headline: Возможность и способность удерживать масштаб — разные вещи
    start_here: 'Рост может начаться раньше, чем появляется готовая система под него. Ограничение не всегда помеха: иногда
      оно показывает, какая конструкция нужна, чтобы рост можно было повторять.'
    pattern: Может хотеться быстро увеличить объём, обязательства, доход или количество проектов. Затем система сталкивается
      с временем и ресурсом, и ограничение начинает ощущаться как потеря шанса.
    protective_function: Быстрое расширение поддерживает ощущение возможностей и помогает не застревать в сомнении.
    cost: Цена — перегрузка и необходимость поддерживать больше, чем текущая система выдерживает.
    distinctions:
    - left: возможность
      right: обязательство
      note: Не каждую возможность нужно превращать в постоянную часть системы.
    - left: масштаб
      right: ценность
      note: Больший объём не автоматически делает направление более значимым.
    values: Что именно должно стать больше — результат, свобода, доход, влияние, мастерство? От ответа зависит форма роста.
    questions:
    - Что именно хочется масштабировать?
    - Какой ресурс станет первым ограничением?
    - Какая возможность не обязана становиться обязательством?
    - Какой небольшой рост можно проверить до большого?
    experiment: Увеличь одну гипотезу роста на небольшой измеримый шаг на короткий срок. Отслеживай один показатель результата
      и один показатель ресурса.
    observe:
    - какие возможности становятся обязательствами автоматически
    - где рост увеличивает ресурс, а где только нагрузку
    - какие ограничения показывают приоритет
  idealism_and_reality:
    headline: Сильное ощущение важно — но оно не равно доказательству
    start_here: 'Интуитивное ощущение, надежда или образ будущего могут быть важной частью решения. Но полезно разделять внутренний
      опыт и вывод о внешней реальности: первое известно напрямую, второе требует проверки.'
    pattern: Недостающие данные могут быстро достраиваться наиболее желаемой или тревожной версией. Отдельный сигнал превращается
      в целую историю о мотивах, будущем или значении события.
    protective_function: 'Цельная история уменьшает неопределённость: даже неприятное объяснение иногда легче переносить,
      чем отсутствие ответа.'
    cost: Если решения опираются на интерпретацию как на подтверждённый факт, реальность всё время должна соответствовать
      построенному образу.
    distinctions:
    - left: чувство
      right: факт
      note: Чувство достоверно как внутренний опыт, но не доказывает внешнее объяснение.
    - left: надежда
      right: прогноз
      note: Надежда не требует уверенности в исходе.
    values: Если не знать заранее, чем всё закончится, какой способ участия в ситуации всё равно соответствует твоим ценностям?
    questions:
    - Что известно непосредственно?
    - Что является интерпретацией?
    - На что хочется надеяться?
    - Какой факт мог бы изменить текущую версию?
    experiment: 'Раздели страницу на три колонки: «факт», «моя интерпретация», «пока неизвестно». Через несколько дней проверь,
      какие предположения получили подтверждение.'
    observe:
    - как быстро ощущение превращается в объяснение
    - какие данные меняют интерпретацию
    - что важно независимо от исхода
  sensitivity_and_boundaries:
    headline: Чувствительность полезна, когда рядом есть граница
    start_here: Быстро замечать тон и изменение контакта — реальная способность. Сложность появляется, когда чужое состояние
      становится твоей задачей или собственное ощущение автоматически принимается за знание чужого мотива.
    pattern: Может хотеться подстроиться раньше собственной позиции, смягчить сообщение, проверить чужую реакцию или взять
      на себя лишнюю ответственность за атмосферу.
    protective_function: Такие реакции снижают риск конфликта и делают среду предсказуемее.
    cost: Если собственная позиция появляется только после учёта всех остальных, граница становится заметна слишком поздно
      и реакция может быть резче.
    distinctions:
    - left: чувствительность
      right: ответственность за другого
      note: Замечать чужое состояние не значит быть обязанным его исправить.
    - left: ощущение
      right: знание мотива
      note: Можно доверять своей реакции, не утверждая причину за другого.
    values: 'Что для тебя значит хороший контакт: только отсутствие напряжения или возможность оставаться в нём со своей позицией?'
    questions:
    - Какие чужие реакции замечаются раньше собственных?
    - Где появляется ответственность за чужую задачу?
    - Как выглядит ранняя граница?
    - Что известно, а что считывается по ощущению?
    experiment: В одной безопасной ситуации сначала сформулируй свою позицию до ответа другому человеку. Не обязательно сразу
      её озвучивать; проверь, меняется ли решение.
    observe:
    - когда чужое состояние становится твоей ответственностью
    - ранние сигналы собственной границы
    - разница между ощущением и фактом
  visibility_and_self_direction:
    headline: Обратная связь и собственный критерий могут существовать вместе
    start_here: 'Чужая реакция важна, но становится тяжёлой, когда отвечает сразу на два вопроса: «понятно ли то, что я делаю?»
      и «имею ли я право считать это достаточно хорошим?».'
    pattern: Когда результат значим, может хотеться заранее представить реакцию других и подстроить форму до реального контакта.
      Это делает сообщение аккуратнее, но может уменьшать собственную позицию.
    protective_function: Предварительная адаптация снижает риск критики и помогает быть понятнее.
    cost: Если чужая оценка становится главным источником права на действие, следующий шаг снова требует нового подтверждения.
    distinctions:
    - left: обратная связь
      right: разрешение
      note: Обратная связь корректирует форму, но не обязана давать право иметь позицию.
    - left: быть понятным
      right: быть одобренным
      note: Сообщение может быть ясным и не нравиться всем.
    values: Какой собственный критерий качества или честности важно сохранять даже при неоднозначной реакции?
    questions:
    - Чью реакцию хочется представить заранее?
    - Что должно подтвердить чужое одобрение?
    - Что можно изменить после обратной связи, а что важно сохранить?
    - Как выглядел бы шаг, если чужая реакция была бы информацией?
    experiment: Покажи одну небольшую вещь раньше обычного. До показа запиши, что важно сохранить и какую информацию хочется
      получить от других. После оцени отклик именно по этим двум задачам.
    observe:
    - какую реакцию хочется предсказать
    - где корректируется форма, а где исчезает позиция
    - как оценка других становится оценкой себя
  achievement_and_rest:
    headline: Пауза не отменяет направление
    start_here: Когда цель важна, продолжать движение может быть проще, чем признать предел ресурса. Но устойчивость требует
      не только способности продолжать, но и способности корректировать нагрузку.
    pattern: 'Может повторяться логика «ещё немного — и потом отдохну»: задача закрывается, но появляется следующая. Снижение
      энергии легко принять за потерю дисциплины, а не за данные о системе.'
    protective_function: Постоянное действие поддерживает ощущение влияния и образ человека, который справляется.
    cost: Цена — снижение качества решений и зависимость самооценки от способности выдерживать нагрузку.
    distinctions:
    - left: отдых
      right: отказ от цели
      note: Пауза может поддерживать цель.
    - left: дисциплина
      right: игнорирование предела
      note: Последовательность включает корректировку нагрузки.
    values: Какой темп позволяет продолжать важное достаточно долго, сохраняя что-то кроме результата?
    questions:
    - Что действительно требует усилия, а что держится на привычке быть занятым?
    - Как меняется качество решений после отдыха?
    - Что кажется опасным в снижении темпа?
    - Что можно убрать на неделю без потери направления?
    experiment: Несколько дней отслеживай не объём работы, а качество состояния после неё — например, способность концентрироваться
      и возвращаться к задаче. Сравни два режима нагрузки.
    observe:
    - где пауза вызывает вину сильнее реальной угрозы цели
    - какие задачи поддерживают направление, а какие только занятость
    - как решения меняются вместе с ресурсом
  harmony_and_honesty:
    headline: Сохранить контакт — не то же самое, что всегда сохранять согласие
    start_here: Желание не разрушать отношения или договорённость может быть важной ценностью. Но гармония становится хрупкой,
      если собственная позиция появляется только там, где заранее не создаёт напряжения.
    pattern: Можно быстрее соглашаться, смягчать формулировку или откладывать неудобный разговор. Это сохраняет контакт в
      моменте, но несогласие становится труднее выражать позже.
    protective_function: Подстраивание снижает риск конфликта и потери связи.
    cost: Если собственное желание не успевает стать ясным до компромисса, договорённость строится без полноценного участия
      твоей позиции.
    distinctions:
    - left: компромисс
      right: автоматическая уступка
      note: Компромисс требует сначала знать свою позицию.
    - left: конфликт
      right: различие
      note: Разные желания не обязательно разрушают связь.
    values: 'Какой контакт считается хорошим: только спокойный или такой, где можно оставаться в отношениях и при этом быть
      несогласным?'
    questions:
    - В каких ситуациях согласие появляется быстрее всего?
    - Успевает ли собственная позиция стать ясной?
    - Какой конфликт хочется предотвратить?
    - Что можно обозначить раньше, пока напряжение небольшое?
    experiment: В одной безопасной ситуации сначала сформулируй свою позицию без требования, чтобы другой человек её разделил.
      Проверь, делает ли различие контакт хуже или точнее.
    observe:
    - когда компромисс происходит до осознания позиции
    - какие различия воспринимаются как опасный конфликт
    - как меняется контакт после ранней честности
  meaning_and_direction:
    headline: Направление может быть яснее, чем весь маршрут
    start_here: 'Вопрос «куда идти?» часто звучит так, будто нужен окончательный ответ. На практике сначала могут быть яснее
      критерии: какие задачи дают смысл, какой способ работы подходит, что хочется создавать или сохранять.'
    pattern: Можно долго сравнивать варианты и отвергать каждый, который не выглядит окончательным решением. Тогда временный
      эксперимент кажется недостаточно серьёзным.
    protective_function: Поиск окончательного ответа защищает от риска вложиться в «не тот» путь и снова пересматривать себя.
    cost: Реальный опыт откладывается до ясности, которая сама могла бы появиться только через опыт.
    distinctions:
    - left: направление
      right: окончательная роль
      note: Можно знать, что хочется строить, не зная финального названия.
    - left: эксперимент
      right: обязательство
      note: Проверка не требует обещать себе весь путь.
    values: Какие 2–3 критерия важно сохранять независимо от формата? Используй их как фильтр экспериментов.
    questions:
    - Какие задачи дают чувство смысла?
    - Что в текущей роли хочется сохранить независимо от названия?
    - Какой вариант отбрасывается только потому, что он не выглядит окончательным?
    - Что можно проверить за две недели без обещания делать это год?
    experiment: 'Выбери один критерий направления и один маленький формат, где его можно проверить: мини-проект, разговор,
      тестовую задачу, публикацию или прототип.'
    observe:
    - какие критерии повторяются в разных вариантах
    - где нужен опыт вместо ещё одного сравнения
    - какие форматы дают желание продолжать
  analysis_and_spontaneity:
    headline: Некоторые ответы появляются только после контакта с реальностью
    start_here: 'Размышление — один из способов получать ясность, но есть вопросы, для которых внутреннего анализа уже недостаточно:
      нужно поговорить, попробовать, показать черновик или прожить кусок решения.'
    pattern: Может повторяться попытка сначала понять всю систему и только потом действовать. Если исход зависит от внешней
      реакции, часть неизвестного не исчезает даже после качественного анализа.
    protective_function: Анализ снижает риск неожиданности и помогает чувствовать компетентность.
    cost: Гипотезы становятся всё сложнее, но остаются гипотезами, если новые данные не появляются.
    distinctions:
    - left: понимание
      right: контроль исхода
      note: Понимать систему не значит заранее знать реакцию реальности.
    - left: анализ
      right: новые данные
      note: Иногда новый факт важнее новой интерпретации старых фактов.
    values: 'Что важнее в этой теме: иметь непротиворечивую модель или научиться действовать точнее через обратную связь?'
    questions:
    - Какой вопрос остаётся после текущего анализа?
    - Можно ли ответить на него без действия?
    - Какие данные уже не меняются от размышления?
    - Какой минимальный тест создаст новые данные?
    experiment: Запиши одну гипотезу и один наблюдаемый результат, который мог бы её поддержать или ослабить. Сделай минимальный
      обратимый тест и только потом возвращайся к анализу.
    observe:
    - какие вопросы решаются только опытом
    - где анализ повторяет уже известное
    - как выводы меняются после новой информации
  depth_and_simplicity:
    headline: Глубина полезна, пока помогает видеть яснее
    start_here: Желание добраться до причины может быть ресурсом. Но не каждая ситуация становится полезнее от ещё одного
      слоя объяснения. Важно различать глубину, которая меняет понимание, и глубину, которая поддерживает невозможность остановиться.
    pattern: Можно возвращаться к теме под новым углом и строить дополнительные связи, хотя следующий практический шаг остаётся
      тем же.
    protective_function: Углубление снижает риск пропустить важное и даёт ощущение полного понимания.
    cost: Если право остановиться всё время переносится на следующий уровень, сложность темы растёт быстрее практической ясности.
    distinctions:
    - left: глубина
      right: бесконечность
      note: Глубокий ответ может быть неполным и всё равно полезным.
    - left: важный слой
      right: новая версия того же вопроса
      note: Не каждый новый угол добавляет новую информацию.
    values: 'Для чего нужно понять эту тему глубже? Ответ даёт критерий достаточной глубины: понимание должно что-то менять.'
    questions:
    - Какой новый вывод появился после последнего круга анализа?
    - Что изменится в действии после ещё одной причины?
    - Какой слой уже достаточно понятен?
    - Как выглядит «достаточно глубоко» для текущей задачи?
    experiment: Запиши текущий лучший вывод и один следующий шаг. Несколько дней не добавляй новые объяснения, пока реальность
      не принесёт новую информацию.
    observe:
    - добавляет ли анализ новый вывод
    - где следующий шаг остаётся прежним
    - как ощущается право временно не знать всё
  action_and_pressure:
    headline: Срочность чувства и срочность действия — разные вещи
    start_here: Сильный импульс действовать может быть важной информацией. Но интенсивность состояния не всегда означает,
      что решение нужно принять немедленно.
    pattern: Когда растёт сопротивление или чувство потери влияния, может хотеться быстрее написать, решить, прекратить или
      вернуть контроль. Действие быстро меняет состояние и легко становится первым способом саморегуляции.
    protective_function: 'Активность возвращает ощущение агентности: ты больше не просто ждёшь исхода.'
    cost: Цена — меньше пространства заметить другие варианты после того, как первая волна напряжения спадёт. Некоторые действия
      необратимы сильнее, чем чувство, которое их запустило.
    distinctions:
    - left: импульс
      right: решение
      note: Импульс может быть сигналом, не становясь приказом.
    - left: агентность
      right: немедленность
      note: Можно действовать активно и всё равно выбирать темп.
    values: Каким способом хочется действовать, если задача — не только прекратить напряжение, но и сохранить важное после
      него?
    questions:
    - Что требует действия прямо сейчас?
    - Решает ли действие внешнюю задачу или внутреннее состояние?
    - Что важно сохранить после снижения напряжения?
    - Какой менее необратимый способ вернуть влияние существует?
    experiment: 'Сначала сделай один маленький шаг, который возвращает агентность, но не закрывает все варианты: собери факт,
      напиши черновик или обозначь границу без окончательного решения.'
    observe:
    - что делает действие срочным
    - какие маленькие шаги возвращают влияние
    - как меняется решение после снижения интенсивности
  structure_and_freedom:
    headline: Структура может поддерживать свободу, а не только ограничивать её
    start_here: 'Часть структуры может быть именно тем, что позволяет важному существовать в реальности: удерживать время,
      границы и повторяемость. Вопрос не «структура или свобода», а качество самой формы.'
    pattern: Можно держаться за правила, потому что они дают предсказуемость, или отбрасывать рамку целиком, когда она начинает
      мешать. Оба варианта обходят перенастройку конструкции.
    protective_function: Структура защищает устойчивость; отказ от неё защищает автономию.
    cost: Правило становится дорогим, если сохраняется после того, как перестало обслуживать задачу. Свобода становится дорогой,
      если любая повторяемость ощущается как потеря себя.
    distinctions:
    - left: структура
      right: запрет
      note: Структура может быть выбранным инструментом.
    - left: свобода
      right: отсутствие формы
      note: Свобода может включать правила, выбранные ради важного.
    values: Какую ценность должна обслуживать структура — творчество, доход, близость, устойчивость, обучение?
    questions:
    - Какое правило реально помогает?
    - Какое существует по инерции?
    - Что становится возможным благодаря повторяемой форме?
    - Какое одно правило можно изменить, не разрушая систему?
    experiment: 'На неделю измени форму одного правила, сохранив его функцию: время, объём, формат или способ участия. Посмотри,
      появляется ли больше свободы без потери полезного эффекта.'
    observe:
    - какие правила поддерживают важное
    - где форма сохраняется по инерции
    - какие ограничения выбраны осознанно
  generic_uncertainty_and_choice:
    headline: Не обязательно получить окончательный ответ, чтобы увидеть следующий шаг
    start_here: 'Если одна центральная динамика не выделяется уверенно, лучше не придумывать скрытый паттерн. Начни с простого:
      что уже известно, что остаётся гипотезой и какой шаг может добавить реальных данных.'
    pattern: Когда вопрос важен, мысли могут возвращаться к нему без новой информации. Важно замечать, меняется ли понимание
      или повторяется та же неопределённость другими словами.
    protective_function: Повторное обдумывание может поддерживать ощущение вовлечённости и контроля.
    cost: Если новых данных нет, анализ расходует ресурс без пропорционального роста ясности.
    distinctions:
    - left: факт
      right: интерпретация
      note: Разделение уменьшает лишнюю уверенность без обесценивания опыта.
    - left: следующий шаг
      right: окончательное решение
      note: Шаг может быть обратимым и информационным.
    values: Что важно сохранить независимо от выбранного варианта?
    questions:
    - Что уже известно?
    - Что сейчас предполагается?
    - Какой вопрос действительно открыт?
    - Какой маленький шаг даст новую информацию?
    experiment: Выбери один открытый вопрос и одно обратимое действие, которое может дать на него данные в течение нескольких
      дней. Не использовать для high-stakes решений.
    observe:
    - появляются ли новые данные или только новые формулировки
    - какие вопросы реально можно проверить
    - что остаётся важным при разных исходах
