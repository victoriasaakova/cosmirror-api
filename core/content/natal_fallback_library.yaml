meta:
  name: cosmirror_natal_fallback_library
  version: '1.0'
  runtime_llm_required: false
  coverage:
    planet_sign_units: 84
    ascendant_sign_units: 12
    house_modifiers: 12
    theme_syntheses: 16
  rules:
  - Use complete semantic units only
  - Never assemble user-facing prose from planet/sign nouns at runtime
  - Never field-merge fallback and LLM content
  - Use houses and angles only when birth-time-dependent data is valid
  - Activate a theme synthesis only from at least two independent supporting units
  - Astrology is a symbolic interpretive framework; lived experience remains the user's authority
