    reflection_question: Что в твоём ощущении подтверждается реальным опытом — а что пока остаётся красивой или
      сильной гипотезой?
    astro_explanation: Асцендент описывает первый способ входить в ситуацию, самопредъявление и интерфейс с миром.
      Рыбы добавляет темы, связанные с тем, чтобы считывать атмосферу, образы, тонкие связи и эмоциональный или
      символический смысл происходящего. Использовать только при валидном времени рождения.
    theme_tags:
    - sensitivity_vs_boundaries
    - idealism_vs_realism
    confidence: high
house_modifiers:
  1:
    label: 1 дом
    focus:
    - самопредъявление
    - инициатива
    - способ входить в ситуацию
    modifier: Эта функция может быть особенно заметна в том, как ты входишь в новые ситуации, обозначаешь себя и
      реагируешь, когда нужно действовать от первого лица. Здесь важнее наблюдать не «какой ты вообще», а какой
      способ самопредъявления включается быстрее всего.
  2:
    label: 2 дом
    focus:
    - личные ресурсы
    - ценность
    - деньги
    - устойчивость
    modifier: 'Эта функция может сильнее проявляться в вопросах личных ресурсов, денег, самоценности и того, что
      создаёт ощущение материальной или внутренней опоры. Не делай из этого прогноз дохода: дом уточняет сферу внимания,
      а не гарантирует финансовый результат.'
  3:
    label: 3 дом
    focus:
    - обучение
    - повседневная коммуникация
    - информация
    modifier: Тема может быть особенно заметна в обучении, повседневных разговорах, обработке информации и способе
      ориентироваться в ближайшей среде. Здесь полезно смотреть, как именно ты задаёшь вопросы, объясняешь и проверяешь
      понимание.
  4:
    label: 4 дом
    focus:
    - дом
    - приватность
    - внутренняя опора
    modifier: 'Эта функция может сильнее проявляться в приватной жизни, ощущении дома и способе создавать внутреннюю
      опору. Не делай выводов о детстве или семье без пользовательских данных: дом показывает сферу, а не конкретную
      биографию.'
  5:
    label: 5 дом
    focus:
    - творчество
    - самовыражение
    - удовольствие
    - игра
    modifier: Тема может быть особенно заметна в творчестве, самовыражении, удовольствии и занятиях, где важен личный
      интерес. Здесь полезно смотреть, что хочется делать не только ради результата, но и потому, что в этом есть
      живой авторский отклик.
  6:
    label: 6 дом
    focus:
    - повседневная работа
    - ритм
    - обязанности
    - системы
    modifier: 'Эта функция может особенно проявляться в повседневной работе, нагрузке, ритме и способе организовывать
      повторяющиеся обязанности. Не выводи из шестого дома болезни: используй его только как сферу повседневных
      систем и нагрузки.'
  7:
    label: 7 дом
    focus:
    - партнёрство
    - взаимность
    - договорённости
    modifier: Тема может становиться особенно заметной в партнёрстве, близком взаимодействии и ситуациях, где нужно
      учитывать одновременно свою и чужую позицию. Дом не описывает судьбу отношений и не позволяет читать мотивы
      партнёра.
  8:
    label: 8 дом
    focus:
    - совместные ресурсы
    - зависимость
    - доверие
    - интенсивность
    modifier: Эта функция может сильнее проявляться там, где есть совместные ресурсы, доверие, зависимость от решений
      других людей или высокая эмоциональная ставка. Не превращай восьмой дом в прогноз кризиса, смерти или «кармической
      трансформации».
  9:
    label: 9 дом
    focus:
    - мировоззрение
    - образование
    - дальний горизонт
    - смысл
    modifier: Тема может быть заметнее в мировоззрении, обучении, путешествиях и вопросах большого направления.
      Здесь важнее смотреть, как человек строит систему смысла и расширяет картину мира, а не предсказывать конкретный
      переезд или обучение.
  10:
    label: 10 дом
    focus:
    - реализация
    - публичная роль
    - карьера
    - вклад
    modifier: Эта функция может сильнее проявляться в публичной роли, профессиональной реализации и вопросе о том,
      какой вклад хочется делать заметным. Дом не предсказывает конкретную профессию, должность или карьерный успех.
  11:
    label: 11 дом
    focus:
    - сообщества
    - долгие цели
    - сети
    - коллективные проекты
    modifier: Тема может быть особенно заметна в сообществах, дружеских сетях, долгих целях и проектах, которые
      выходят за рамки одного человека. Здесь полезно смотреть, какую роль ты выбираешь внутри группы и какие идеи
      хочется поддерживать вместе с другими.
  12:
    label: 12 дом
    focus:
    - уединение
    - внутренний фон
    - неявные процессы
    - восстановление
    modifier: Эта функция может сильнее проявляться в уединении, внутреннем фоне и процессах, которые не всегда
      сразу переводятся в действие или слова. Не делай из двенадцатого дома диагнозов, тайных врагов или фатальных
      сценариев.
theme_synthesis:
  safety_vs_change:
    headline: Опора важна — но знакомое не всегда равно подходящее
    narrative: 'В карте может несколько раз повторяться тема устойчивости и потребности иметь понятную опору. Это
      помогает не метаться и выдерживать длинные процессы. Сложность начинается, если предсказуемость становится
      главным критерием выбора: тогда знакомое может удерживаться дольше, чем реально поддерживает. Более гибкая
      позиция — не отказываться от стабильности, а отделять саму опору от конкретной формы, к которой ты привык.'
    reflection_question: Что из привычного действительно даёт тебе опору — а что просто давно знакомо?
    min_supporting_units: 2
  autonomy_vs_closeness:
    headline: Близость важна — но только если в ней остаётся место для себя
    narrative: Несколько частей карты могут одновременно усиливать потребность в контакте и право сохранять собственную
      волю. Поэтому трудность может быть не в том, что ты «не умеешь быть близко», а в поиске формы, где связь не
      требует растворения. Ресурс здесь — способность замечать границы. Цена появляется, если дистанция становится
      единственным способом их защищать.
    reflection_question: Какая форма близости позволяет тебе оставаться отдельным человеком без необходимости отдаляться?
    min_supporting_units: 2
  control_vs_uncertainty:
    headline: Контроль помогает — пока не становится попыткой отменить неизвестность
    narrative: В карте может повторяться серьёзное отношение к риску, влиянию и предсказуемости. Это полезно для
      сложных решений и глубоких задач. Но если контроль нужен прежде всего для того, чтобы вообще не чувствовать
      неопределённость, он начинает требовать всё больше ресурсов и всё меньше даёт ясности.
    reflection_question: Где тебе действительно не хватает информации или влияния — а где уже не хватает гарантии,
      которой невозможно получить?
    min_supporting_units: 2
  visibility_vs_protection:
    headline: Проявляться хочется — но не любой ценой
    narrative: Здесь может повторяться напряжение между желанием быть увиденным и потребностью сначала убедиться,
      что среда безопасна. Такая чувствительность помогает выбирать контекст и качество проявления. Но если полная
      безопасность становится условием, видимость откладывается слишком надолго.
    reflection_question: Какой уровень риска для проявления уже приемлем, даже если реакцию других нельзя контролировать?
    min_supporting_units: 2
  self_expression_vs_self_criticism:
    headline: Высокая планка помогает — и может задерживать
    narrative: Несколько факторов могут связывать проявление с внутренней проверкой качества. Это создаёт внимательность,
      ремесло и способность улучшать. Цена появляется, если право действовать или показывать результат зависит от
      исчезновения сомнения.
    reflection_question: Что уже достаточно хорошо, чтобы встретиться с реальной обратной связью?
    min_supporting_units: 2
  achievement_vs_rest:
    headline: Способность выдерживать нагрузку не обязана становиться обязанностью
    narrative: Карта может давать сильную ориентацию на ответственность, результат и собранность. Это реальный ресурс.
      Но если ценность себя подтверждается в основном через способность справляться, отдых и пересмотр нагрузки
      начинают выглядеть как слабость, хотя иногда именно они сохраняют систему рабочей.
    reflection_question: Что ты продолжаешь нести потому, что это важно — а что потому, что умеешь выдерживать?
    min_supporting_units: 2
  analysis_vs_spontaneity:
    headline: Понимание помогает выбирать — пока не заменяет сам выбор
    narrative: Здесь может быть много интеллектуальной подвижности, проверки и интереса к вариантам. Это расширяет
      картину и снижает риск слишком простых выводов. Сложность начинается, если ещё одна версия становится способом
      не занимать временную позицию.
    reflection_question: Какой вопрос тебе действительно нужно ещё исследовать — а какой уже достаточно понятен
      для действия?
    min_supporting_units: 2
  sensitivity_vs_boundaries:
    headline: Чувствительность даёт много информации — если рядом остаются границы
    narrative: Карта может усиливать восприимчивость к людям, атмосфере и нюансам. Это помогает замечать то, что
      другие пропускают. Но сильное ощущение ещё не доказывает объяснение ситуации. Полезно соединять впечатление
      с фактами и различать своё состояние и чужой контекст.
    reflection_question: Что в твоём впечатлении подтверждается наблюдаемыми фактами — а что пока остаётся ощущением?
    min_supporting_units: 2
  idealism_vs_realism:
    headline: Большая картина важна — но ей нужна проверка реальностью
    narrative: Здесь может быть сильная способность видеть смысл, возможность и желаемую форму будущего. Это поддерживает
      творчество и движение. Цена появляется, если образ становится убедительнее текущих данных. Гибкость — не отказаться
      от идеала, а дать ему критерии реальности.
    reflection_question: Какой конкретный факт или действие покажет, что идея уже начинает существовать не только
      в воображении?
    min_supporting_units: 2
  freedom_vs_commitment:
    headline: Свобода и обязательство не всегда противоположности
    narrative: В карте может повторяться потребность самостоятельно выбирать форму жизни и не попадать в слишком
      тесные правила. Это помогает замечать, где система перестала работать. Но если любое обязательство переживается
      как потеря свободы, становится трудно строить то, что требует времени.
    reflection_question: Какие обязательства ты выбираешь сам именно потому, что они поддерживают важную для тебя
      свободу или цель?
    min_supporting_units: 2
  harmony_vs_honesty:
    headline: Мир в контакте важен — но не ценой исчезновения позиции
    narrative: Здесь может быть сильная способность видеть несколько сторон и снижать ненужное трение. Это улучшает
      отношения и переговоры. Сложность начинается, если гармония становится важнее ясности, и несогласие выражается
      слишком поздно.
    reflection_question: Где компромисс остаётся твоим выбором — а где уже скрывает несогласие?
    min_supporting_units: 2
  meaning_and_direction:
    headline: Тебе важно не только что делать, но и ради чего
    narrative: Несколько факторов карты могут усиливать потребность видеть горизонт и смысл усилия. Это помогает
      сохранять мотивацию и соединять отдельные действия в курс. Цена возникает, если большая идея должна заранее
      гарантировать правильность каждого шага.
    reflection_question: Какой смысл уже достаточно важен, чтобы сделать следующий шаг без гарантии всей траектории?
    min_supporting_units: 2
  quality_and_action:
    headline: Качество усиливает результат — пока не становится условием старта
    narrative: В карте может повторяться внимательность к стандарту, деталям и реальной работоспособности. Это сильный
      ресурс для ремесла. Но если действие допускается только после полной внутренней проверки, подготовка начинает
      заменять реальность.
    reflection_question: Какая проверка ещё улучшит результат — а какая уже только отсрочит его проверку миром?
    min_supporting_units: 2
  pace_and_stability:
    headline: Свой темп может быть важной частью устойчивости
    narrative: Здесь может повторяться способность работать лучше без постоянной спешки и резких переключений. Это
      помогает глубине и последовательности. Сложность начинается, если любой внешний темп автоматически воспринимается
      как угроза, а адаптация — как потеря себя.
    reflection_question: Какие изменения можно встроить в твой темп, не превращая адаптацию в отказ от опоры?
    min_supporting_units: 2
  depth_vs_simplicity:
    headline: Глубина полезна — но не каждый вопрос требует максимальной ставки
    narrative: Некоторые факторы карты могут делать поверхностный ответ неудовлетворительным. Это помогает исследовать
      сложные темы, замечать мотивы и выдерживать интенсивность. Цена появляется, если простое решение кажется недостаточно
      серьёзным только потому, что не требует глубины.
    reflection_question: Где сейчас действительно нужна глубина — а где достаточно простого рабочего ответа?
    min_supporting_units: 2
  reciprocity_and_self_position:
    headline: Учитывать другого и сохранять свою позицию — две отдельные задачи
    narrative: Карта может усиливать чувствительность к справедливости, обмену и реакции партнёра. Это создаёт хороший
      социальный интеллект. Но взаимность становится менее реальной, если собственная позиция появляется только
      после того, как известна позиция другого.
    reflection_question: Что ты хочешь здесь сам, прежде чем начнёшь искать решение, которое устроит обе стороны?
    min_supporting_units: 2
